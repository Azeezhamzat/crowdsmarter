services:
  backend:
    environment:
      ENABLE_METRICS_ENDPOINT: "true"
      LOG_FORMAT: json

  prometheus:
    image: prom/prometheus:v3.7.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./operations/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./operations/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["observability"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./operations/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    profiles: ["observability"]

  loki:
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./operations/observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    profiles: ["observability"]

  alloy:
    image: grafana/alloy:v1.18.0
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - ./operations/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    depends_on: [loki]
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./operations/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./operations/observability/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki]
    profiles: ["observability"]

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  grafana_data:
