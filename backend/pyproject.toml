[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdsmarter-backend"
version = "0.5.0"
description = "The CrowdSmarter modular-monolith backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "dj-database-url>=2.3,<4",
  "psycopg[binary]>=3.2,<4",
  "celery>=5.5,<6",
  "redis>=6,<7",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
  "pytest-cov>=6,<7",
  "factory-boy>=3.3,<4",
  "ruff>=0.16,<0.17",
  "mypy>=1.16,<2",
  "django-stubs[compatible-mypy]>=5.2,<6",
  "djangorestframework-stubs[compatible-mypy]>=3.16,<4",
]
s3 = [
  "django-storages[s3]>=1.14,<2",
  "boto3>=1.39,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crowdsmarter*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "crowdsmarter.settings.test"
python_files = ["test_*.py", "*_tests.py"]
addopts = "--strict-markers --strict-config --tb=short"
testpaths = ["apps"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations", "tests", "conftest.py", "admin.py"]

[tool.django-stubs]
django_settings_module = "crowdsmarter.settings.test"
