services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crowdsmarter}
      POSTGRES_USER: ${POSTGRES_USER:-crowdsmarter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crowdsmarter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crowdsmarter} -d ${POSTGRES_DB:-crowdsmarter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:1.4.6
    platform: linux/amd64
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    profiles: ["security"]

  backend:
    build:
      context: ./backend
      target: development
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://crowdsmarter:crowdsmarter@db:5432/crowdsmarter}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    command: >-
      sh -c "python -m crowdsmarter.wait_for_database
      && python manage.py migrate
      && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/live/', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: ./backend
      target: development
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://crowdsmarter:crowdsmarter@db:5432/crowdsmarter}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    command: >-
      sh -c "python -m crowdsmarter.wait_for_database
      && celery -A crowdsmarter worker --loglevel=INFO"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["workers"]

  scheduler:
    build:
      context: ./backend
      target: development
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://crowdsmarter:crowdsmarter@db:5432/crowdsmarter}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    command: >-
      sh -c "python -m crowdsmarter.wait_for_database
      && celery -A crowdsmarter beat --loglevel=INFO
      --schedule=/tmp/celerybeat-schedule"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["workers"]

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_PUBLIC_CONTACT_EMAIL: ${VITE_PUBLIC_CONTACT_EMAIL:-hello@crowdsmarter.com}
      VITE_DEMO_EMAIL: ${VITE_DEMO_EMAIL:-hello@crowdsmarter.com}
      VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-hello@crowdsmarter.com}
      VITE_PRIVACY_EMAIL: ${VITE_PRIVACY_EMAIL:-hello@crowdsmarter.com}
      VITE_SECURITY_EMAIL: ${VITE_SECURITY_EMAIL:-hello@crowdsmarter.com}
      VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL:-http://localhost:8000/admin/}
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  media_data:
  frontend_node_modules:
  clamav_data:
