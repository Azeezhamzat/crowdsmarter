services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crowdsmarter}
      POSTGRES_USER: ${POSTGRES_USER:-crowdsmarter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crowdsmarter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crowdsmarter} -d ${POSTGRES_DB:-crowdsmarter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://crowdsmarter:crowdsmarter@db:5432/crowdsmarter}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: development
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://crowdsmarter:crowdsmarter@db:5432/crowdsmarter}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    command: celery -A crowdsmarter worker --loglevel=INFO
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["workers"]

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:
  frontend_node_modules:
