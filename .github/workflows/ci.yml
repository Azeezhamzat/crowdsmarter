name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crowdsmarter_test
          POSTGRES_USER: crowdsmarter
          POSTGRES_PASSWORD: crowdsmarter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crowdsmarter -d crowdsmarter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: crowdsmarter.settings.test
      DATABASE_URL: postgresql://crowdsmarter:crowdsmarter@127.0.0.1:5432/crowdsmarter_test
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check .
      - run: mypy crowdsmarter apps
      - run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d db backend frontend
      - run: |
          for attempt in {1..30}; do
            curl --fail http://localhost:5173/login && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm install
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npm run test:e2e
      - if: always()
        run: docker compose logs
